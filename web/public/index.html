<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC Listening Player</title>
<style>
  :root { --bg:#0f1216; --card:#1a1f27; --line:#2a313c; --fg:#e7ecf3; --mut:#8b97a7; --acc:#4f9cf9; --play:#16321f; --playline:#2f7d4d; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:20px 16px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { color:var(--mut); font-size:14px; }
  main { max-width:760px; margin:0 auto; padding:16px 16px 90px; }
  .drop { border:2px dashed var(--line); border-radius:14px; padding:28px 16px; text-align:center; color:var(--mut); cursor:pointer; transition:.12s; }
  .drop:hover, .drop.over { border-color:var(--acc); color:var(--fg); }
  .drop input { display:none; }
  .prog { margin:16px 0; }
  .prog .track { height:8px; background:var(--card); border-radius:6px; overflow:hidden; }
  .prog .fill { height:100%; width:0; background:var(--acc); transition:width .2s; }
  .prog .label { font-size:13px; color:var(--mut); margin-top:6px; }
  .part { margin:24px 0 8px; color:var(--mut); font-size:13px; text-transform:uppercase; letter-spacing:.08em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:8px; }
  button.q { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:12px 8px; cursor:pointer; font-size:14px; transition:.12s; }
  button.q:hover { border-color:var(--acc); }
  button.q.playing { background:var(--play); border-color:var(--playline); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; }
  .bar .now { flex:1; font-size:14px; color:var(--mut); }
  .bar .now b { color:var(--fg); }
  .bar button { background:var(--acc); color:#04101f; border:0; border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; }
  .hint { font-size:12px; color:var(--mut); margin-top:10px; }
  a { color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>TOEIC Listening Player</h1>
  <div class="sub" id="sub">Upload a TOEIC listening mp3 — it's transcribed in your browser and split into question buttons. Nothing is uploaded to any server.</div>
</header>
<main id="main">
  <label class="drop" id="drop">
    <input type="file" id="file" accept="audio/*">
    <div><b>Choose an audio file</b> or drop it here</div>
    <div class="hint">First run downloads a ~40 MB speech model (cached after). A 45-min file takes a few minutes on a laptop.</div>
  </label>
  <div class="prog" id="prog" hidden>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="label" id="plabel"></div>
  </div>
  <div id="list"></div>
</main>
<div class="bar" hidden id="playbar">
  <div class="now" id="now">Pick a question</div>
  <button id="stop">Stop</button>
</div>
<audio id="audio" preload="metadata"></audio>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5";

const $ = (id) => document.getElementById(id);
const audio = $("audio");

// ---- TOEIC cue detection (mirror of cut.js) -------------------------------
const GROUP_WORD = /questions?\s+([\w-]+)\s+(?:through|to|and)\s+([\w-]+)/i;
const GROUP_DASH = /questions?\s+(\d+)\s*[-–]\s*(\d+)/i;
const SINGLE = /(?:^|\s)(?:question|number)\s+([\w-]+)\b/i;
const ONES = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,zero:0};
const TENS = {twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
const w2n = (s) => { let n=0,ok=false; for (const t of s.toLowerCase().replace(/-/g," ").split(/\s+/)){ if(t in ONES){n+=ONES[t];ok=true;} else if(t in TENS){n+=TENS[t];ok=true;} } return ok?n:null; };
const pn = (t) => { const d=String(t).match(/\d+/); return d?+d[0]:w2n(t); };
const p3 = (n) => "q"+String(n).padStart(3,"0");
const rl = (a,b) => "q"+String(a).padStart(3,"0")+"-"+String(b).padStart(3,"0");

// chunks: [{text, timestamp:[start,end]}] from whisper -> questions[]
function detectQuestions(chunks, duration) {
  const gs = new Map(), ss = new Map();
  for (const c of chunks) {
    const t = c.text, start = c.timestamp[0];
    if (start == null) continue;
    const g = t.match(GROUP_WORD) || t.match(GROUP_DASH);
    if (g) { const a = pn(g[1]); if (a>=1 && a<=100 && !gs.has(a)) gs.set(a, start); continue; }
    const m = t.match(SINGLE);
    if (m) { const n = pn(m[1]); if (n>=1 && n<=100 && !ss.has(n)) ss.set(n, start); }
  }
  const clean = [];
  for (let q=1; q<=31; q++) if (ss.has(q)) clean.push({ start: ss.get(q), label: p3(q) });
  for (let a=32; a<=100; a+=3) {
    const b = Math.min(a+2,100);
    const st = gs.get(a) ?? ss.get(a) ?? ss.get(a+1) ?? ss.get(b);
    if (st != null) clean.push({ start: st, label: rl(a,b) });
  }
  clean.sort((x,y) => x.start - y.start);
  return clean.map((mk,i) => ({
    label: mk.label,
    start: +mk.start.toFixed(2),
    end: +(i+1<clean.length ? clean[i+1].start : duration).toFixed(2),
  }));
}

// ---- transcription --------------------------------------------------------
let transcriber = null;

async function getModel() {
  if (transcriber) return transcriber;
  setProg(0, "Downloading speech model (first time only)…");
  // fp32 avoids a quantized-weights load error in the bundled ONNX runtime.
  transcriber = await pipeline("automatic-speech-recognition", "Xenova/whisper-base.en", {
    dtype: "fp32",
    progress_callback: (p) => {
      if (p.status === "progress" && p.total) setProg(p.progress/100*0.3, `Downloading model… ${Math.round(p.progress)}%`);
    },
  });
  return transcriber;
}

// Decode the file to the 16 kHz mono Float32 whisper expects.
async function decodeAudio(file) {
  const buf = await file.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const decoded = await ctx.decodeAudioData(buf);
  return { data: decoded.getChannelData(0), duration: decoded.duration };
}

async function handleFile(file) {
  $("list").innerHTML = "";
  $("prog").hidden = false;
  audio.src = URL.createObjectURL(file);

  const model = await getModel();
  setProg(0.35, "Reading audio…");
  const { data, duration } = await decodeAudio(file);

  setProg(0.45, "Transcribing in your browser… this is the slow part.");
  // No language/task: whisper-base.en is English-only and rejects them.
  const out = await model(data, {
    return_timestamps: true,
    chunk_length_s: 30,
    stride_length_s: 5,
  });

  setProg(1, "Done");
  const questions = detectQuestions(out.chunks || [], duration);
  $("prog").hidden = true;
  if (!questions.length) {
    $("list").innerHTML = '<p class="hint">No TOEIC question cues found. This file may not be a standard TOEIC test, or the audio quality was too low to transcribe the directions.</p>';
    return;
  }
  render(questions, duration);
}

function setProg(frac, label) {
  $("fill").style.width = Math.round(frac*100) + "%";
  $("plabel").textContent = label;
}

// ---- player UI ------------------------------------------------------------
function partOf(label) {
  const n = parseInt(label.slice(1), 10);
  if (n <= 6) return "Part 1 — Photographs";
  if (n <= 31) return "Part 2 — Question & Response";
  if (n <= 70) return "Part 3 — Conversations";
  return "Part 4 — Talks";
}
const pretty = (label) => label.slice(1).split("-").map((s) => String(parseInt(s,10))).join("–");

let current = null;
let buttons = [];

function render(questions, duration) {
  $("playbar").hidden = false;
  $("sub").textContent = `${questions.length} questions · ${Math.round(duration/60)} min`;
  const list = $("list");
  buttons = [];
  let lastPart = null, grid = null;
  for (const q of questions) {
    const part = partOf(q.label);
    if (part !== lastPart) {
      const h = document.createElement("div");
      h.className = "part"; h.textContent = part;
      list.appendChild(h);
      grid = document.createElement("div"); grid.className = "grid";
      list.appendChild(grid);
      lastPart = part;
    }
    const btn = document.createElement("button");
    btn.className = "q"; btn.textContent = pretty(q.label);
    btn.onclick = () => play(q, btn);
    grid.appendChild(btn);
    buttons.push(btn);
  }
}

function play(q, btn) {
  buttons.forEach((b) => b.classList.remove("playing"));
  btn.classList.add("playing");
  current = { end: q.end, btn };
  $("now").innerHTML = `Playing <b>${btn.textContent}</b>`;
  audio.currentTime = q.start;
  audio.play();
}

audio.addEventListener("timeupdate", () => {
  if (current && audio.currentTime >= current.end) {
    audio.pause();
    current.btn.classList.remove("playing");
    $("now").textContent = "Finished " + current.btn.textContent;
    current = null;
  }
});

$("stop").onclick = () => {
  audio.pause();
  if (current) current.btn.classList.remove("playing");
  current = null;
  $("now").textContent = "Stopped";
};

// ---- file input + drag/drop ----------------------------------------------
$("file").onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };
const drop = $("drop");
["dragover","dragenter"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
</script>
</body>
</html>
